<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joom25 Test Page</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #1a7f37;
      --border: #d0d7de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #9198a1;
        --accent: #3fb950;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    h1 { margin: 12px 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      margin: 0;
      font-size: 0.9rem;
    }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <span class="status"><span class="dot"></span>Site is live</span>
    <h1>GitHub Pages test</h1>
    <p>If you can see this page, GitHub Pages is serving <code>index.html</code> from the <code>main</code> branch.</p>
    <dl>
      <dt>Repo</dt><dd>Joom25/Joom25.github.io</dd>
      <dt>URL</dt><dd id="url"></dd>
      <dt>Loaded</dt><dd id="time"></dd>
    </dl>
  </main>
  <script>
    document.getElementById('url').textContent = location.href;
    document.getElementById('time').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
